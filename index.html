const POOL={"bond": [{"id": 5, "question": "哈洛的恆河猴實驗中，幼猴大多依偎在哪裡？", "choices": ["有奶瓶的鐵絲媽媽", "柔軟的布媽媽", "角落的玩具", "其他幼猴身上"], "answerIndex": 1, "explain": "這個實驗顯示接觸安慰的重要性，依附不只是為了獲得食物。", "mistakes": {"有奶瓶的鐵絲媽媽": "幼猴只在喝奶時靠近鐵絲媽媽，其餘時間多依偎布媽媽。"}, "tier": 0}, {"id": 6, "question": "Ainsworth 的陌生情境實驗，主要是觀察幼兒的什麼？", "choices": ["智力高低", "語言能力", "與照顧者分離和重聚時的反應", "對玩具顏色的偏好"], "answerIndex": 2, "explain": "特別是重聚時的反應，是判斷依附類型的重要線索。", "tier": 0}, {"id": 7, "question": "「因為後面有人可靠，所以我敢往前闖。」最符合 Bowlby 的哪個概念？", "choices": ["古典制約", "責任分散", "社會助長", "安全基地"], "answerIndex": 3, "explain": "安全基地讓人在需要時有地方回來，也因此更敢探索。", "tier": 1}, {"id": 8, "question": "早期經驗形成「別人可靠嗎？我值得被愛嗎？」的心智地圖，稱為？", "choices": ["內在運作模式", "操作制約", "基模同化", "習慣迴路"], "answerIndex": 0, "explain": "內在運作模式會影響日後對關係的預期，但可透過覺察與新經驗調整。", "mistakes": {"基模同化": "基模是皮亞傑的認知概念；這裡問的是 Bowlby 關於關係的概念。"}, "tier": 2}, {"id": 9, "question": "關於依附風格測驗的結果，下列哪個態度最恰當？", "choices": ["結果決定一輩子的感情", "這是可以覺察與改變的傾向", "可以用來判斷同學好壞", "分數低代表人格有問題"], "answerIndex": 1, "explain": "測驗是自我了解的起點，不是標籤；風格會隨經驗而調整。", "tier": 2}, {"id": 101, "question": "Bowlby 認為依附為什麼會演化出來？", "choices": ["為了學會說話", "靠近照顧者能提高生存機會", "為了贏得比賽", "為了吃得更多"], "answerIndex": 1, "explain": "依附讓幼兒在危險時靠近照顧者，是有利生存的系統。", "tier": 0}, {"id": 102, "question": "朋友訊息沒回，就一直傳訊息確認對方是否生氣。較接近哪種傾向？", "choices": ["迴避", "安全", "焦慮", "沒有傾向"], "answerIndex": 2, "explain": "高度在意對方回應是焦慮傾向的常見表現，但這只是傾向，不是標籤。", "tier": 1}, {"id": 103, "question": "吵架後小宇總說「沒事，我自己處理」，並拉開距離。較接近哪種傾向？", "choices": ["迴避", "焦慮", "安全", "從眾"], "answerIndex": 0, "explain": "用距離保護自己，是迴避傾向常見的反應。", "tier": 1}, {"id": 1001, "question": "小真 16 歲，常問「我到底想成為什麼樣的人？」並嘗試不同社團與風格。依 Erikson，她最可能處於哪個課題？", "choices": ["親密對孤立", "勤奮對自卑", "認同對角色混淆", "生產對停滯"], "answerIndex": 2, "explain": "Erikson 認為青少年的核心課題是建立自我認同；嘗試不同角色是正常歷程。", "tier": 3}, {"id": 1002, "question": "小宇已認真探索多種方向，但尚未做出承諾。依 Marcia 的認定狀態，最符合？", "choices": ["未定型", "早閉", "認定達成", "未決（探索中）"], "answerIndex": 3, "explain": "未決是「有探索、未承諾」；早閉是未探索就接受他人安排。", "tier": 3}, {"id": 1003, "question": "學生在同學提示下才解出難題，獨立時還做不到。依 Vygotsky，這段差距稱為？", "choices": ["近側發展區", "同化", "客體恆存", "關鍵期"], "answerIndex": 0, "explain": "近側發展區是獨立能力與在協助下能達到的水準之間的距離，鷹架就作用於此。", "tier": 3}, {"id": 1004, "question": "評估青少年適應時，同時看家庭、學校、社區與文化的相互影響，最接近哪種觀點？", "choices": ["古典制約", "生態系統理論", "基模理論", "心理性發展論"], "answerIndex": 1, "explain": "Bronfenbrenner 的生態系統理論強調個體與多層環境的交互作用。", "tier": 3}, {"id": 1005, "question": "成人依附研究中，「成人依附訪談」的評估重點比較接近哪一項？", "choices": ["智商高低", "童年事件是否悲慘", "敘說童年經驗的連貫性", "目前有無戀人"], "answerIndex": 2, "explain": "它重視當事人如何敘說並整合經驗，而不只是發生過什麼。", "tier": 2}, {"kind": "order", "question": "依 Erikson，排出青少年到老年的課題", "items": ["認同對角色混淆", "親密對孤立", "生產對停滯", "統整對絕望"], "explain": "八階段理論強調發展貫穿一生。", "tier": 1, "id": 1129}, {"kind": "order", "question": "依 Piaget，排出認知發展階段", "items": ["感覺動作期", "前運思期", "具體運思期", "形式運思期"], "explain": "青少年多進入形式運思，能進行假設與抽象思考。", "tier": 2, "id": 1130}, {"kind": "tf", "question": "依附風格一旦形成，一輩子都不會改變。", "choices": ["正確", "錯誤"], "answerIndex": 1, "explain": "依附風格有穩定性，但能透過覺察與新經驗改變。", "tier": 0, "id": 1131}, {"kind": "match", "question": "配對研究者與貢獻", "pairs": [["布媽媽與鐵絲媽媽", "Harlow"], ["安全基地", "Bowlby"], ["陌生情境", "Ainsworth"]], "explain": "三位研究者共同奠定依附研究的基礎。", "tier": 1, "id": 1132}], "behave": [{"id": 10, "question": "巴夫洛夫實驗中，訓練完成後「鈴聲」屬於？", "choices": ["非制約刺激", "非制約反應", "制約刺激", "增強物"], "answerIndex": 2, "explain": "鈴聲原本是中性刺激，與食物配對後成為制約刺激。", "mistakes": {"非制約刺激": "非制約刺激是本來就會引發反應的東西，這裡是食物。"}, "tier": 0}, {"id": 11, "question": "小艾伯特實驗中，讓孩子開始害怕白鼠的關鍵是？", "choices": ["白鼠咬了他", "大人告訴他白鼠很危險", "他天生怕白鼠", "白鼠與巨響反覆配對"], "answerIndex": 3, "explain": "這說明情緒反應可經由古典制約學來，但實驗本身也有嚴重的倫理問題。", "tier": 1}, {"id": 12, "question": "阿哲把房間整理好，媽媽就不再念他，之後他更常整理。這是？", "choices": ["負增強", "正增強", "懲罰", "消弱"], "answerIndex": 0, "explain": "移除討厭的刺激（念）而讓行為增加，就是負增強。", "mistakes": {"懲罰": "懲罰會讓行為減少；這裡整理房間的行為是增加的。", "正增強": "正增強是「加上」喜歡的東西；這裡是「拿掉」討厭的東西。"}, "tier": 2}, {"id": 13, "question": "讀完一章就獎勵自己看一集劇，之後更願意讀書。這是？", "choices": ["負增強", "正增強", "刺激類化", "責任分散"], "answerIndex": 1, "explain": "給予喜歡的結果使行為增加，就是正增強。", "tier": 0}, {"id": 14, "question": "波波娃娃實驗最重要的發現是？", "choices": ["孩子天生具攻擊性", "只有懲罰才能學習", "光是觀察他人也能學會行為", "娃娃的顏色影響情緒"], "answerIndex": 2, "explain": "Bandura 指出觀察與模仿也是學習，不一定要親身得到獎懲。", "tier": 1}, {"id": 15, "question": "段考前一聽到鐘聲就胃緊。若想用古典制約的原理調整，較合適的是？", "choices": ["告訴自己不准緊張", "考差就懲罰自己", "完全避開所有考試", "在放鬆的狀態下逐步接觸相關情境"], "answerIndex": 3, "explain": "讓線索反覆出現但不伴隨壓力，並搭配放鬆，能逐漸減弱原本學到的連結。", "tier": 2}, {"id": 1006, "question": "小安怕上台。治療師先教放鬆，再依焦慮程度由低到高逐步想像上台情境。這是？", "choices": ["系統減敏法", "嫌惡治療", "代幣制", "空椅法"], "answerIndex": 0, "explain": "Wolpe 的系統減敏結合放鬆與焦慮階層，運用交互抑制原理。", "tier": 3}, {"id": 1007, "question": "老師決定忽略學生上課怪叫，結果怪叫先變得更嚴重。最可能的解釋是？", "choices": ["正增強", "消弱爆發", "刺激類化", "社會懈怠"], "answerIndex": 1, "explain": "行為失去增強後，常先短暫增強再下降。此時若又給注意，反而形成間歇增強。", "tier": 3}, {"id": 1008, "question": "強迫症患者接觸引發焦慮的情境，並練習不做強迫行為。這種介入是？", "choices": ["自由聯想", "生理回饋", "暴露與反應預防", "夢的解析"], "answerIndex": 2, "explain": "暴露與反應預防讓個案學到不做儀式，焦慮也會下降。", "tier": 3}, {"id": 1009, "question": "手機遊戲的轉蛋不知道第幾次才中，卻讓人一直抽。最接近哪種強化時制？", "choices": ["固定時距", "固定比率", "變動時距", "變動比率"], "answerIndex": 3, "explain": "變動比率時制的反應率高，也最不容易消弱。", "tier": 3}, {"id": 1010, "question": "想了解行為為何持續，先記錄前因、行為與後果。這稱為？", "choices": ["自由聯想", "行為功能分析", "認知重建", "投射測驗"], "answerIndex": 1, "explain": "功能分析找出維持行為的條件，再據此設計介入。", "tier": 1}, {"id": 1011, "question": "「先寫完數學，才能打遊戲」用高頻活動增強低頻活動，是哪個原則？", "choices": ["普雷馬克原則", "霍桑效應", "比馬龍效應", "雙因子論"], "answerIndex": 0, "explain": "普雷馬克原則以較喜歡的活動增強較不喜歡的活動。", "tier": 2}, {"kind": "multi", "question": "下列哪些屬於操作制約？（複選）", "choices": ["打掃完得到獎勵", "聞到麵包香流口水", "遲到被扣分", "寫完作業不用被念"], "answers": [0, 2, 3], "explain": "操作制約看行為後果；聞香流口水屬古典制約。", "tier": 1, "id": 1133}, {"kind": "match", "question": "配對增強與懲罰", "pairs": [["加上喜歡的，行為增加", "正增強"], ["拿掉討厭的，行為增加", "負增強"], ["加上討厭的，行為減少", "正懲罰"]], "explain": "「正」是加上，「負」是拿掉；不是好壞的意思。", "tier": 2, "id": 1134}, {"kind": "tf", "question": "負增強的目的是讓行為減少。", "choices": ["正確", "錯誤"], "answerIndex": 1, "explain": "增強都是讓行為增加；讓行為減少的是懲罰或消弱。", "tier": 0, "id": 1135}, {"kind": "order", "question": "依序排出系統減敏法的流程", "item n": "領導者要保護團體空間，以尊重的方式回饋行為並促進互動。", "tier": 3}, {"id": 1014, "question": "團隊開始出現意見衝突與爭主導權，依 Tuckman 較接近哪個階段？", "choices": ["風暴期", "形成期", "規範期", "表現期"], "answerIndex": 0, "explain": "風暴期的衝突是常見過程，處理得好才能走向規範與合作。", "tier": 3}, {"id": 1015, "question": "小組決策時大家為了和諧不提反對意見，最後做出糟糕決定。這稱為？", "choices": ["社會助長", "團體迷思", "月暈效應", "自利偏誤"], "answerIndex": 1, "explain": "Janis 提出團體迷思：追求一致壓過了對方案的批判評估。", "tier": 3}, {"id": 1016, "question": "抽菸的人說「我爸抽了也很長壽」，以減輕行為與知識矛盾的不舒服。這是？", "choices": ["從眾", "增強", "認知失調", "社會懈怠"], "answerIndex": 2, "explain": "Festinger 認為人會調整想法，以降低認知與行為不一致造成的不適。", "tier": 2}, {"id": 1017, "question": "小組報告時，人越多，有些人越不出力。這稱為？", "choices": ["社會助長", "責任感", "普同性", "社會懈怠"], "answerIndex": 3, "explain": "共同作業且個人貢獻難辨識時，容易出現社會懈怠。", "tier": 1}, {"kind": "match", "question": "配對研究者與主題", "pairs": [["線段判斷實驗", "Asch"], ["電擊服從實驗", "Milgram"], ["認知失調", "Festinger"]], "explain": "三者都展現了情境與社會歷程對人的影響。", "tier": 1, "id": 1137}, {"kind": "multi", "question": "下列哪些能減少旁觀者效應？（複選）", "choices": ["指定特定的人幫忙", "清楚說明需要什麼", "等更多人來", "讓每個人知道自己的責任"], "answers": [0, 1, 3], "explain": "具體指定與清楚求助能減少責任分散。", "tier": 2, "id": 1138}, {"kind": "order", "question": "依 Tuckman，排出團隊發展階段", "items": ["形成", "風暴", "規範", "表現"], "explain": "團隊的衝突是歷程的一部分，不一定代表失敗。", "tier": 3, "id": 1139}, {"kind": "tf", "question": "人多的時候，一定有人會出手幫忙。", "choices": ["正確", "錯誤"], "answerIndex": 1, "explain": "旁觀者效應顯示，人多時責任容易分散。", "tier": 0, "id": 1140}], "mind": [{"id": 24, "question": "Loftus 的車禍實驗，改變問句用詞後發現什麼？", "choices": ["參與者對車速的判斷也跟著改變", "所有人記憶都一樣", "用詞完全沒有影響", "參與者都不記得影片"], "answerIndex": 0, "explain": "用「猛撞」提問時估的車速較高，顯示記憶會被事後訊息影響。", "tier": 0}, {"id": 25, "question": "DRM 實驗聽完「床、枕頭、夢、鬧鐘」，許多人「記得」聽過「睡覺」。這說明？", "choices": ["大家聽力不好", "記憶是主動建構的", "睡覺能增加記憶", "人類無法記單字"], "answerIndex": 1, "explain": "大腦依照意義來重建內容，因此可能產生假記憶，而且當事人很有把握。", "tier": 1}, {"id": 26, "question": "H.M. 手術後的狀況，最能說明什麼？", "choices": ["失憶就什麼都不能學", "所有記憶都存在同一處", "不同類型的記憶由不同系統支持", "海馬迴只管動作"], "answerIndex": 2, "explain": "他難以形成新的外顯記憶，卻能練會動作技能，顯示記憶不是單一系統。", "mistakes": {"失憶就什麼都不能學": "H.M. 的鏡描技能會進步，只是不記得自己練習過。"}, "tier": 2}, {"id": 27, "question": "葉杜二氏法則指出，表現最好的通常是？", "choices": ["完全沒有壓力時", "壓力越大越好", "只有早上", "壓力適中時"], "answerIndex": 3, "explain": "壓力與表現呈倒 U 型，太低或太高都不利表現。", "tier": 0}, {"id": 28, "question": "段考前一晚，下列哪個做法最符合睡眠與記憶的研究？", "choices": ["複習重點後好好睡覺", "整晚不睡讀到天亮", "只喝咖啡撐著", "考前都不複習"], "answerIndex": 0, "explain": "睡眠有助記憶固化；犧牲睡眠常讓隔天的專注與回憶都變差。", "tier": 1}, {"id": 29, "question": "「21 天養成習慣」的說法，較符合研究的是？", "choices": ["每個人都剛好 21 天", "養成時間個別差異很大", "習慣無法養成", "只要 7 天"], "answerIndex": 1, "explain": "Lally 等人的研究平均約 66 天，範圍 18～254 天，中斷一天也沒有關係。", "tier": 0}, {"id": 30, "question": "倫敦計程車司機的海馬迴研究，支持了哪個概念？", "choices": ["責任分散", "負增強", "神經可塑性", "從眾"], "answerIndex": 2, "explain": "長期的經驗與練習，能改變大腦的結構與功能。", "tier": 1}, {"id": 31, "question": "想養成睡前複習英文的習慣，用習慣迴路設計，最好的是？", "choices": ["下定決心每天讀兩小時", "等有心情時再讀", "讀不完就罰自己", "刷完牙背 3 個單字，完成後打勾"], "answerIndex": 3, "explain": "「刷牙」是線索、「背 3 個」是小行為、「打勾」是獎賞，門檻低才容易持續。", "tier": 2}, {"id": 32, "question": "朋友已讀不回，甲想「他討厭我」而難過，乙想「他在忙」而平靜。依 ABC 模型，兩人差別在？", "choices": ["想法 B 不同", "事件 A 不同", "他們的朋友不同", "手機不同"], "answerIndex": 0, "explain": "同一件事，不同的解讀帶來不同情緒；這也是認知行為取向的核心。", "mistakes": {"事件 A 不同": "兩人遇到的事件都是已讀不回，差別出在解讀。"}, "tier": 2}, {"id": 1018, "question": "心算時需暫存數字並同時運算。Baddeley 模型中負責協調注意的是？", "choices": ["中央執行系統", "感覺記憶", "程序記憶", "語意網路"], "answerIndex": 0, "explain": "中央執行系統負責分配注意，並協調語音迴路與視覺空間模板。", "tier": 3}, {"id": 1019, "question": "腦傷後能記得受傷前的事，卻記不住新認識的人。這較符合？", "choices": ["逆向失憶", "順向失憶", "語意痴呆", "選擇性注意"], "answerIndex": 1, "explain": "順向失憶是難以形成新記憶；逆向失憶則是失去受傷前的記憶。", "tier": 3}, {"id": 1020, "question": "學了新密碼後，舊密碼反而想不起來。這屬於？", "choices": ["前攝干擾", "記憶廣度", "倒攝干擾", "閃光燈記憶"], "answerIndex": 2, "explain": "倒攝干擾是新學習妨礙舊記憶；前攝干擾則是舊學習妨礙新學習。", "tier": 3}, {"id": 1021, "question": "會騎腳踏車卻說不清楚怎麼做到的，這主要屬於？", "choices": ["情節記憶", "語意記憶", "工作記憶", "程序記憶"], "answerIndex": 3, "explain": "程序記憶屬於內隱記憶，常無法用語言完整說明。", "tier": 3}, {"id": 1022, "question": "念完書會自問「我真的懂了嗎？該換方法嗎？」這種能力是？", "choices": ["後設認知", "感覺適應", "知覺恆常", "制約反應"], "answerIndex": 0, "explain": "後設認知是對自身思考的監控與調整。", "tier": 2}, {"id": 1023, "question": "顏色字「紅」用藍墨水印，要說出墨水顏色時變慢。這是？", "choices": ["史楚普效應", "倒U曲線", "閃光燈記憶", "旁觀者效應"], "answerIndex": 0, "explain": "讀字的自動化反應干擾了命名顏色，常用來研究注意與抑制控制。", "tier": 1}, {"kind": "order", "question": "排出 Atkinson 與 Shiffrin 記憶模型的流程", "items": ["感覺記憶", "短期記憶", "長期記憶"], "explain": "訊息經注意進入短期記憶，再經複誦編碼進入長期記憶。", "tier": 1, "id": 1141}, {"kind": "match", "question": "配對大腦部位與功能", "pairs": [["情緒與恐懼處理", "杏仁核"], ["新記憶形成", "海馬迴"], ["計畫與抑制", "前額葉"]], "explain": "青少年的前額葉仍在發展中。", "tier": 2, "id": 1142}, {"kind": "multi", "question": "下列哪些屬於外顯記憶？（複選）", "choices": ["昨天早餐吃什麼", "法國首都是巴黎", "騎腳踏車", "畢業旅行的回憶"], "answers": [0, 1, 3], "explain": "情節與語意記憶屬外顯；騎車屬內隱的程序記憶。", "tier": 3, "id": 1143}, {"kind": "tf", "question": "多巴胺只代表快樂，和學習與動機無關。", "choices": ["正確", "錯誤"], "answerIndex": 1, "explain": "多巴胺與獎賞預期、動機和學習有關，並不等於快樂本身。", "tier": 0, "id": 1144}], "cbt": [{"id": 201, "question": "認知行為取向認為，下列哪三者會互相影響？", "choices": ["想法、情緒、行為", "身高、體重、年齡", "星座、血型、生肖", "成績、班級、座號"], "answerIndex": 0, "explain": "改變想法或行為，都可能連帶影響情緒。", "tier": 0}, {"id": 202, "question": "ABC 模型中的 B 指的是什麼？", "choices": ["結果", "想法或信念", "事件", "行為獎賞"], "answerIndex": 1, "explain": "A 是事件，B 是對事件的想法，C 是情緒與行為結果。", "tier": 0}, {"id": 203, "question": "「這次考差，我的人生完了。」最接近哪種想法陷阱？", "choices": ["正增強", "社會助長", "災難化", "安全基地"], "answerIndex": 2, "explain": "把一次事件放大成最糟結果，就是災難化。", "tier": 1}, {"id": 204, "question": "「不是第一名，就是失敗者。」最接近哪種想法陷阱？", "choices": ["從眾", "記憶固化", "負增強", "全有全無"], "answerIndex": 3, "explain": "只用兩個極端評價自己，忽略中間的許多可能。", "tier": 1}, {"id": 205, "question": "「他沒打招呼，一定是討厭我。」用 CBT 的方法，下一步最好是？", "choices": ["找支持和不支持這想法的證據", "馬上封鎖對方", "告訴全班", "不再和任何人說話"], "answerIndex": 0, "explain": "先檢驗想法，也想想其他可能，例如對方沒看到你。", "tier": 1}, {"id": 206, "question": "說出「我現在很焦慮」這類情緒命名，較可能帶來什麼幫助？", "choices": ["立刻消除所有情緒", "更能覺察並調節情緒", "讓別人替你負責", "證明自己有問題"], "answerIndex": 1, "explain": "替情緒命名是調節的起點，目標不是消滅情緒。", "tier": 2}, {"id": 207, "question": "上台前很緊張，下列哪個做法較能幫助身體放鬆？", "choices": ["憋氣到結束", "快速喘氣", "緩慢呼吸並拉長吐氣", "一直告訴自己不准緊張"], "answerIndex": 2, "explain": "緩慢呼吸、拉長吐氣，有助於身體從緊繃回到平穩。", "tier": 0}, {"id": 1024, "question": "個案說：「我很糟、世界很冷漠、未來沒希望。」這對應 Beck 的哪個概念？", "choices": ["移情", "認知三角", "自我分化", "超我"], "answerIndex": 1, "explain": "認知三角指對自我、世界、未來的負向看法。", "tier": 3}, {"id": 1025, "question": "治療師問：「支持這想法的證據是什麼？有其他解釋嗎？」這種技術是？", "choices": ["蘇格拉底式提問", "自由聯想", "系統減敏", "家庭星座"], "answerIndex": 0, "explain": "蘇格拉底式提問引導個案自己檢視想法，而不是由治療師直接反駁。", "tier": 3}, {"id": 1026, "question": "憂鬱的個案什麼都不想做。安排小而可行、有意義的活動，屬於？", "choices": ["夢的解析", "空椅法", "暴露治療", "行為活化"], "answerIndex": 3, "explain": "行為活化先增加接觸正向經驗的機會，不必等到有動力才行動。", "tier": 3}, {"id": 1027, "question": "小杰說：「戒手遊是好，但我又覺得沒差。」動機式晤談較合適的回應是？", "choices": ["你一定要戒", "反映矛盾，引出他想改變的話語", "直接給戒除計畫", "告訴他後果多嚴重"], "answerIndex": 1, "explain": "動機式晤談尊重自主，透過反映矛盾引出個案自己的改變理由。", "tier": 3}, {"id": 1028, "question": "Ellis 的 ABCDE 中，D 指的是？", "choices": ["駁斥非理性信念", "事件", "情緒結果", "新的效果"], "answerIndex": 0, "explain": "D 是 Disputing，駁斥非理性信念；E 是隨之而來的新效果。", "tier": 3}, {"id": 1029, "question": "接納與承諾治療強調把「我很差」看成「我有個想法是我很差」。這稱為？", "choices": ["認知脫鉤", "昇華", "增強", "阻抗"], "answerIndex": 0, "explain": "認知脫鉤是與想法拉開距離，不必與它對抗或完全相信。", "tier": 2}, {"id": 1030, "question": "「我從沒想過要改」屬於 Prochaska 改變階段的哪一期？", "choices": ["行動期", "維持期", "懷疑前期", "準備期"], "answerIndex": 2, "explain": "懷疑前期的人尚未覺得需要改變，介入要配合其準備度。", "tier": 1}, {"kind": "order", "question": "排出 Ellis 的 ABCDE 流程", "items": ["事件", "信念", "結果", "駁斥", "新效果"], "explain": "REBT 由檢視非理性信念著手。", "tier": 1, "id": 1145}, {"kind": "multi", "question": "下列哪些是認知扭曲？（複選）", "choices": ["災難化", "全有全無", "讀心術", "行為活化"], "answers": [0, 1, 2], "explain": "行為活化是介入方法，其他三者是常見思考陷阱。", "tier": 2, "id": 1146}, {"kind": "match", "question": "配對改變階段與個案說法", "pairs": [["我沒問題", "懷疑前期"], ["我知道該改，但還沒準備好", "懷疑期"], ["我下週開始", "準備期"], ["我已經在做了", "行動期"]], "explain": "Prochaska 的模式提醒介入要配合個案的改變階段。", "tier": 3, "id": 1147}, {"kind": "tf", "question": "照顧情緒的目標，是讓自己永遠不會有負面情緒。", "choices": ["正確", "錯誤"], "answerIndex": 1, "explain":   const fin=v=>{waiter=null;sfx.a();res(v)};
